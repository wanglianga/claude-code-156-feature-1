server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: cold-chain
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/coldchain}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  auth:
    secret: ${APP_SECRET:county-cold-chain-secret-2026}
    ttl-hours: 12
  precool:
    # 温度超标预冷费单价（元/公斤）
    fee-per-kg: 0.3
  billing:
    # 分拣工时单价（元/分钟）
    labor-rate-per-minute: 0.6
    # 分拣损耗率告警阈值
    loss-rate-warn: 0.05
    loss-rate-critical: 0.10

logging:
  level:
    com.county.coldchain: info
